---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: "Manual Test 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:

permissions: {}

# Serialise runs; never cancel an in-flight test run, so the
# cleanup job always removes the test releases/tags it created.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  test:
    name: "Quick test"
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Create test releases and tags via the GitHub API
    timeout-minutes: 5
    steps:
      # yamllint disable rule:line-length
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

       # yamllint disable rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Create release and artifact"
        id: setup
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        shell: bash
        run: |
          # Create build artifacts
          DATE="$(date +%Y-%m-%d-%H%M)"
          TAG="release-$DATE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Create tag first (via API; checkout has no credentials),
          # then draft release
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

          # Wait a moment for tag to be available
          sleep 2

          gh release create "$TAG" --draft --title "$TAG" --notes "Test"

          # Verify release was created
          gh release view "$TAG" || {
            echo "Failed to create release for tag $TAG"
            exit 1
          }

          echo "$DATE" > artifact-01.txt
          echo "$DATE" > artifact-02.txt

      - name: "List releases and tags"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          RELEASE_TAG: "${{ steps.setup.outputs.tag }}"
        shell: bash
        run: |
          echo "Listing all releases:"
          gh release list --limit 10
          echo ""
          echo "Listing all tags:"
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" \
            --jq '.[].ref' | sed 's|refs/tags/||' | \
            grep -E '^(release-|second-release-)' || true
          echo ""
          echo "Trying to view release with tag: $RELEASE_TAG"
          gh release view "$RELEASE_TAG" || echo "Release not found via gh CLI"

      - name: "Upload single artifact [using release tag]"
        uses: ./
        with:
          asset_paths: '["artifact-01.txt"]'
          release_tag: "${{ steps.setup.outputs.tag }}"

      - name: "Upload artifacts with glob [using release tag]"
        uses: ./
        with:
          asset_paths: '["artifact-*.txt"]'
          release_tag: "${{ steps.setup.outputs.tag }}"
          deny_overwrite: false

      - name: "Create second release"
        id: setup2
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        shell: bash
        run: |
          # Create second release with tag
          DATE="$(date +%Y-%m-%d-%H%M)"
          TAG="second-release-$DATE"
          RELEASE="Second Release $DATE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$RELEASE" >> "$GITHUB_OUTPUT"

          # Create tag first (via API; checkout has no credentials),
          # then draft release
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

          # Wait a moment for tag to be available
          sleep 2

          gh release create "$TAG" --draft --title "$RELEASE" --notes "Test"

          # Verify release was created
          gh release view "$TAG" || {
            echo "Failed to create release for tag $TAG"
            exit 1
          }

      - name: "Upload single artifact [using release name only]"
        uses: ./
        with:
          asset_paths: '["artifact-01.txt"]'
          release_name: "${{ steps.setup2.outputs.name }}"

      - name: "Upload artifacts with glob [using release name]"
        uses: ./
        with:
          asset_paths: '["artifact-*.txt"]'
          release_tag: "${{ steps.setup2.outputs.tag }}"
          release_name: "${{ steps.setup2.outputs.name }}"
          deny_overwrite: false

  cleanup:
    name: "Cleanup test releases"
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Delete test releases and tags
    timeout-minutes: 2
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Delete test releases"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          echo "Cleaning up test releases..."
          gh release list --limit 50 --repo "$REPO" --json tagName \
            --jq '.[] | select(.tagName | test("^(release-|second-release-)")) | .tagName' | \
            while read -r tag; do
              echo "Deleting release: $tag"
              gh release delete "$tag" --yes --cleanup-tag --repo "$REPO" || true
            done

          echo ""
          echo "Cleaning up any remaining test tags..."
          gh api "repos/$REPO/git/matching-refs/tags/release-" \
            --jq '.[].ref' | sed 's|refs/tags/||' | while read -r tag; do
            echo "Deleting tag: $tag"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" 2>/dev/null || echo "Tag $tag already deleted"
          done
          gh api "repos/$REPO/git/matching-refs/tags/second-release-" \
            --jq '.[].ref' | sed 's|refs/tags/||' | while read -r tag; do
            echo "Deleting tag: $tag"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" 2>/dev/null || echo "Tag $tag already deleted"
          done

          echo "✅ Cleanup complete"
