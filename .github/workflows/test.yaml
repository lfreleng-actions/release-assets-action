---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: "Integration Tests 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions: {}

# Every tag and release this workflow creates starts with this prefix,
# unique to the run attempt. Cleanup deletes only refs matching it, so
# it can never touch a legitimate tag or another run's test releases.
env:
  TEST_PREFIX: "integration-test-${{ github.run_id }}-${{ github.run_attempt }}"

# Serialise runs; never cancel an in-flight test run, so the
# cleanup job always removes the test releases/tags it created.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  test:
    name: "Quick test"
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Create test releases and tags via the GitHub API
    timeout-minutes: 5
    steps:
      # yamllint disable rule:line-length
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

       # yamllint disable rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Create release and artifact"
        id: setup
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        shell: bash
        run: |
          # Create build artifacts
          TAG="$TEST_PREFIX-release"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Create tag first (via API; checkout has no credentials),
          # then draft release. Tags created with GITHUB_TOKEN do not
          # trigger release.yaml. The release is a prerelease so that
          # Release Drafter, which also runs on push to main and only
          # updates non-prerelease drafts, never adopts it.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

          # Wait a moment for tag to be available
          sleep 2

          gh release create "$TAG" --draft --prerelease --title "$TAG" \
            --notes "Test"

          # Verify release was created
          gh release view "$TAG" || {
            echo "Failed to create release for tag $TAG"
            exit 1
          }

          echo "$TAG" > artifact-01.txt
          echo "$TAG" > artifact-02.txt

      - name: "List releases and tags"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          RELEASE_TAG: "${{ steps.setup.outputs.tag }}"
        shell: bash
        run: |
          echo "Listing all releases:"
          gh release list --limit 10
          echo ""
          echo "Listing test tags for this run:"
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TEST_PREFIX-" \
            --jq '.[].ref' | sed 's|refs/tags/||'
          echo ""
          echo "Trying to view release with tag: $RELEASE_TAG"
          gh release view "$RELEASE_TAG" || echo "Release not found via gh CLI"

      - name: "Upload single artifact [using release tag]"
        uses: $/
        with:
          asset_paths: '["artifact-01.txt"]'
          release_tag: "${{ steps.setup.outputs.tag }}"

      - name: "Upload artifacts with glob [using release tag]"
        uses: $/
        with:
          asset_paths: '["artifact-*.txt"]'
          release_tag: "${{ steps.setup.outputs.tag }}"
          deny_overwrite: false

      - name: "Create second release"
        id: setup2
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        shell: bash
        run: |
          # Create second release with tag
          TAG="$TEST_PREFIX-second-release"
          RELEASE="Second Release $TEST_PREFIX"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$RELEASE" >> "$GITHUB_OUTPUT"

          # Create tag first (via API; checkout has no credentials),
          # then draft prerelease (see the first release step)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

          # Wait a moment for tag to be available
          sleep 2

          gh release create "$TAG" --draft --prerelease \
            --title "$RELEASE" --notes "Test"

          # Verify release was created
          gh release view "$TAG" || {
            echo "Failed to create release for tag $TAG"
            exit 1
          }

      - name: "Upload single artifact [using release name only]"
        uses: $/
        with:
          asset_paths: '["artifact-01.txt"]'
          release_name: "${{ steps.setup2.outputs.name }}"

      - name: "Upload artifacts with glob [using release tag and name]"
        uses: $/
        with:
          asset_paths: '["artifact-*.txt"]'
          release_tag: "${{ steps.setup2.outputs.tag }}"
          release_name: "${{ steps.setup2.outputs.name }}"
          deny_overwrite: false

  cleanup:
    name: "Cleanup test releases"
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Delete test releases and tags
    timeout-minutes: 2
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Delete test releases"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Each test release is created after its tag, so this run's
          # tags reach every release it made
          echo "Cleaning up test releases and tags: $TEST_PREFIX-*"
          gh api "repos/$REPO/git/matching-refs/tags/$TEST_PREFIX-" \
            --jq '.[].ref' | sed 's|refs/tags/||' | while read -r tag; do
            echo "Deleting release: $tag"
            gh release delete "$tag" --yes --cleanup-tag --repo "$REPO" || true
            echo "Deleting tag: $tag"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" 2>/dev/null || echo "Tag $tag already deleted"
          done

          echo "✅ Cleanup complete"
